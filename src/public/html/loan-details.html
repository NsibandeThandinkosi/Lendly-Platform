<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Loan Details - Lendly</title>

    <link
        rel="stylesheet"
        href="../css/loan-details.css"
    >
    <link
        rel="stylesheet"
        href="../css/innerStyle.css"
    >

</head>


<body>

    <div class="dashboard-page">


        <!-- SIDEBAR -->

        <aside class="sidebar">

            <a href="/dashboard" class="logo">

                <span class="logo-icon">
                    L
                </span>

                Lendly

            </a>


            <nav class="sidebar-nav">

                <a
                    href="/dashboard"
                    class="nav-item"
                >
                    <span class="nav-icon">
                        ▦
                    </span>

                    Dashboard
                </a>


                <a
                    href="/loans"
                    class="nav-item active"
                >
                    <span class="nav-icon">
                        ↗
                    </span>

                    Loans
                </a>


                <a
                    href="/collections"
                    class="nav-item"
                >
                    <span class="nav-icon">
                        ✓
                    </span>

                    Collections
                </a>


                <a
                    href="/borrowers"
                    class="nav-item"
                >
                    <span class="nav-icon">
                        ♙
                    </span>

                    Borrowers
                </a>

            </nav>

        </aside>



        <!-- MAIN CONTENT -->

        <main class="main-content">


            <!-- TOPBAR -->

            <header class="topbar">

                <div>

                    <p class="page-label">
                        Loan Management
                    </p>

                    <h1>
                        Loan Details
                    </h1>

                </div>

            </header>



            <!-- LOAN DETAILS -->

            <section class="loan-details-content">

                <a
                    href="/loans"
                    class="back-to-loans"
                >
                    ← Back to Loans
                </a>


                <div
                    id="loanDetails"
                    class="loan-details-card"
                >

                    <!-- JavaScript inserts details -->

                </div>


            </section>

        </main>

    </div>


    <script src="../js/profile.js"></script>

    <script src="../js/loan-details.js"></script>

</body>

</html>
