<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Collections - Lendly</title>


    <!-- SHARED STYLES -->

    <link
        rel="stylesheet"
        href="../css/innerStyle.css"
    >


    <!-- COLLECTIONS PAGE STYLES -->

    <link
        rel="stylesheet"
        href="../css/collections.css"
    >

</head>


<body>


    <div class="dashboard-page">


        <!-- ==================================================
             SIDEBAR
        =================================================== -->

        <aside class="sidebar">


            <a
                href="/dashboard"
                class="logo"
            >

                <span class="logo-icon">
                    L
                </span>

                Lendly

            </a>


            <nav class="sidebar-nav">


                <!-- Dashboard -->

                <a
                    href="/dashboard"
                    class="nav-item"
                >

                    <span class="nav-icon">
                        ▦
                    </span>

                    Dashboard

                </a>


                <!-- Loans -->

                <a
                    href="/loans"
                    class="nav-item"
                >

                    <span class="nav-icon">
                        ↗
                    </span>

                    Loans

                </a>


                <!-- Collections -->

                <a
                    href="/collections"
                    class="nav-item active"
                >

                    <span class="nav-icon">
                        ✓
                    </span>

                    Collections

                </a>


                <!-- Borrowers -->

                <a
                    href="/borrowers"
                    class="nav-item"
                >

                    <span class="nav-icon">
                        ♙
                    </span>

                    Borrowers

                </a>


            </nav>


        </aside>



        <!-- ==================================================
             MAIN CONTENT
        =================================================== -->

        <main class="main-content">


            <!-- ==================================================
                 TOPBAR
            =================================================== -->

            <header class="topbar">


                <div>

                    <p class="page-label">
                        Lendly
                    </p>

                    <h1>
                        Collections
                    </h1>

                </div>


                <!-- TOPBAR RIGHT -->

                <div class="topbar-right">

                    <!-- Profile -->

                    <button
                        class="user-profile"
                        id="profileButton"
                    >

                        <div
                            class="user-avatar"
                            id="userAvatar"
                        >
                            --
                        </div>

                        <div>

                            <strong id="userName">
                                Loading...
                            </strong>

                            <span>
                                Loan Manager
                            </span>

                        </div>

                    </button>


                </div>


            </header>



            <!-- ==================================================
                 COLLECTIONS CONTENT
            =================================================== -->

            <section class="collections-content">


                <!-- PAGE HEADER -->

                <div class="collections-page-header">


                    <div>

                        <h2>
                            Collected Loans
                        </h2>

                        <p>
                            View and manage loans that have been fully fulfilled.
                        </p>

                    </div>


                    <!-- SUMMARY -->

                    <div class="collection-summary">


                        <div class="collection-summary-item">

                            <span>
                                Total collected
                            </span>

                            <strong id="totalCollected">
                                R0
                            </strong>

                        </div>


                        <div class="collection-summary-item">

                            <span>
                                Fulfilled loans
                            </span>

                            <strong id="totalLoans">
                                0
                            </strong>

                        </div>


                    </div>


                </div>



                <!-- COLLECTION LIST -->

                <div
                    class="collections-list"
                    id="collectionsList"
                >

                    <!-- JavaScript will insert
                         collection records here -->

                </div>


            </section>


        </main>


    </div>



    <!-- JAVASCRIPT -->
    <script type="module" src="../js/user-profile.js"></script>
    <script type="module" src="../js/collections.js"></script>


</body>

</html>
