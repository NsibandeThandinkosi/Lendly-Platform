<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Profile - Lendly</title>

    <link
        rel="stylesheet"
        href="../css/innerStyle.css"
    >
    <link
        rel="stylesheet"
        href="../css/profile.css"
    >

</head>


<body>

    <div class="dashboard-page">


        <!-- SIDEBAR -->

        <aside class="sidebar">

            <a href="/dashboard" class="logo">

                <span class="logo-icon">
                    L
                </span>

                Lendly

            </a>


            <nav class="sidebar-nav">

                <a
                    href="/dashboard"
                    class="nav-item"
                >
                    <span class="nav-icon">
                        ▦
                    </span>

                    Dashboard
                </a>


                <a
                    href="/loans"
                    class="nav-item"
                >
                    <span class="nav-icon">
                        ↗
                    </span>

                    Loans
                </a>


                <a
                    href="/collections"
                    class="nav-item"
                >
                    <span class="nav-icon">
                        ✓
                    </span>

                    Collections
                </a>


                <a
                    href="/borrowers"
                    class="nav-item"
                >
                    <span class="nav-icon">
                        ♙
                    </span>

                    Borrowers
                </a>

            </nav>

        </aside>



        <!-- MAIN CONTENT -->

        <main class="main-content">


            <!-- TOP BAR -->

            <header class="topbar">

                <div>

                    <p class="page-label">
                        Account
                    </p>

                    <h1>
                        My Profile
                    </h1>

                </div>

            </header>



            <!-- PROFILE CONTENT -->

            <section class="profile-content">


                <div class="profile-card">


                    <!-- PROFILE HEADER -->

                    <div class="profile-header">

                        <div class="large-user-avatar">
                            TN
                        </div>


                        <div>

                            <h2>
                                Admin
                            </h2>

                            <p>
                                Loan Manager
                            </p>

                        </div>

                    </div>



                    <!-- PROFILE INFORMATION -->

                    <div class="profile-section">

                        <h3>
                            Personal Information
                        </h3>


                        <div class="profile-grid">


                            <div class="profile-field">

                                <span>
                                    Full Name
                                </span>

                                <strong>
                                    Themba Ngema
                                </strong>

                            </div>


                            <div class="profile-field">

                                <span>
                                    Email
                                </span>

                                <strong>
                                    admin@lendly.co.za
                                </strong>

                            </div>


                            <div class="profile-field">

                                <span>
                                    Phone
                                </span>

                                <strong>
                                    +27 71 234 5678
                                </strong>

                            </div>


                            <div class="profile-field">

                                <span>
                                    Role
                                </span>

                                <strong>
                                    Loan Manager
                                </strong>

                            </div>


                        </div>

                    </div>



                    <!-- LOGOUT -->

                    <div class="profile-actions">

                        <button
                            class="logout-button"
                            id="logoutButton"
                        >
                            Logout
                        </button>

                    </div>


                </div>


            </section>

        </main>

    </div>
    <script src="../js/profile.js"></script>

</body>

</html>
