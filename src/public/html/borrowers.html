<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Borrowers - Lendly</title>

    <!-- SHARED STYLES -->
    <link 
        rel="stylesheet" 
        href="../css/innerStyle.css"
    >

    <!-- PAGE STYLES -->

    <link
        rel="stylesheet"
        href="../css/borrowers.css"
    >

</head>


<body>


    <div class="dashboard-page">


        <!-- ==================================================
             SIDEBAR
        =================================================== -->

        <aside class="sidebar">


            <a
                href="dashboard.html"
                class="logo"
            >

                <span class="logo-icon">
                    L
                </span>

                Lendly

            </a>


            <nav class="sidebar-nav">


                <a
                    href="dashboard.html"
                    class="nav-item"
                >

                    <span class="nav-icon">
                        ▦
                    </span>

                    Dashboard

                </a>


                <a
                    href="loans.html"
                    class="nav-item"
                >

                    <span class="nav-icon">
                        ↗
                    </span>

                    Loans

                </a>


                <a
                    href="collections.html"
                    class="nav-item"
                >

                    <span class="nav-icon">
                        ✓
                    </span>

                    Collections

                </a>


                <a
                    href="borrowers.html"
                    class="nav-item active"
                >

                    <span class="nav-icon">
                        ♙
                    </span>

                    Borrowers

                </a>


            </nav>


        </aside>



        <!-- ==================================================
             MAIN CONTENT
        =================================================== -->

        <main class="main-content">


            <!-- TOPBAR -->

            <header class="topbar">


                <div>

                    <p class="page-label">
                        Borrowers
                    </p>

                    <h1>
                        Borrowers
                    </h1>

                </div>


                <div class="topbar-right">


                    <button
                        class="user-profile"
                        onclick="window.location.href='profile.html'"
                    >

                        <div class="user-avatar">
                            TN
                        </div>

                        <div>

                            <strong>
                                Thandinkosi
                            </strong>

                            <span>
                                Account
                            </span>

                        </div>

                    </button>


                </div>


            </header>



            <!-- ==================================================
                 BORROWERS CONTENT
            =================================================== -->

            <section class="borrowers-content">


                <!-- PAGE HEADER -->

                <div class="borrowers-page-header">


                    <div>

                        <h2>
                            All Borrowers
                        </h2>

                        <p>
                            Manage your saved borrowers and their loans.
                        </p>

                    </div>


                    <button
                        class="create-borrower-btn"
                        id="createBorrowerBtn"
                    >
                        + New Borrower
                    </button>


                </div>



                <!-- SEARCH -->

                <div class="borrowers-toolbar">


                    <div class="borrower-search">

                        <span>
                            ⌕
                        </span>

                        <input
                            type="text"
                            id="borrowerSearch"
                            placeholder="Search borrowers..."
                        >

                    </div>


                    <span
                        class="borrower-count"
                        id="borrowerCount"
                    >
                        0 borrowers
                    </span>


                </div>



                <!-- BORROWER LIST -->

                <div
                    class="borrowers-list"
                    id="borrowersList"
                >

                    <!-- JavaScript inserts borrowers here -->

                </div>


            </section>


        </main>


    </div>



    <script src="../js/borrowers.js"></script>

</body>

</html>
